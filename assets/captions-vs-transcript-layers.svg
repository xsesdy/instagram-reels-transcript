<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">Instagram Reel text layers</title><desc id="desc">Four distinct layers: spoken audio, caption layer, visual text, and transcript.</desc>
<rect width="1200" height="640" rx="28" fill="#f8f8fc"/>
<text x="600" y="86" text-anchor="middle" font-family="Arial, sans-serif" font-size="42" font-weight="700" fill="#242434">One Reel, four separate text layers</text>
<g font-family="Arial, sans-serif"><rect x="74" y="160" width="490" height="120" rx="22" fill="#e7dcff"/><text x="112" y="208" font-size="27" font-weight="700" fill="#3d206e">Spoken audio</text><text x="112" y="248" font-size="22" fill="#3d206e">What can become a transcript</text><rect x="636" y="160" width="490" height="120" rx="22" fill="#dcecff"/><text x="674" y="208" font-size="27" font-weight="700" fill="#1d4774">Caption layer</text><text x="674" y="248" font-size="22" fill="#1d4774">Timed words viewers may see</text><rect x="74" y="352" width="490" height="120" rx="22" fill="#ffe8d8"/><text x="112" y="400" font-size="27" font-weight="700" fill="#824315">Visual text</text><text x="112" y="440" font-size="22" fill="#824315">Names, labels, prices in the frame</text><rect x="636" y="352" width="490" height="120" rx="22" fill="#dff4e8"/><text x="674" y="400" font-size="27" font-weight="700" fill="#1c6042">Post description</text><text x="674" y="440" font-size="22" fill="#1c6042">The creator's written caption</text><path d="M600 300v46M600 346l-12-14M600 346l12-14" stroke="#5f6070" stroke-width="6" fill="none"/><text x="600" y="548" text-anchor="middle" font-size="27" font-weight="700" fill="#242434">Check the published Reel before comparing any layer.</text></g>
</svg>
